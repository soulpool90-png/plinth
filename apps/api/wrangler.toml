name = "plinth-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_WEB_URL = "https://plinth.dev"
API_PUBLIC_URL = "https://api.plinth.dev"

[[d1_databases]]
binding = "DB"
database_name = "plinth"
database_id = "REPLACE_AT_SETUP"

[observability]
enabled = true
